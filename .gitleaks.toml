title = "jlogicsoftware-web"

[extend]
useDefault = true

[allowlist]
description = "Public-by-design identifiers, not credentials."
regexes = [
  # Cloudflare Web Analytics beacon token — served in HTML to every visitor.
  '''bdb7df8e38a6474f9bd8b37010d50229''',
  # D1 database_id — an identifier, useless without an API token and account access.
  '''97697ed2-a230-43c4-a63f-8d421def1861''',
  # Access AUD is the public application audience in JWT claims, not a signing
  # key or bearer token. Access still requires a verified signature and identity.
  '''^d6e5b0410b5e62a5e40653cca7ee7f8bc540343ecdf6c7bf0fedbc18f3ee6888$''',
]
paths = [
  '''fonts/.*''',
  '''images/.*''',
  '''.*\.(png|jpe?g|woff2?|ico)$''',
]
